{{ define "main" }}
{{ partial "page-intro.html" . }}
<section class="shell page-body">
  <p class="intro-statement registry-intro">{{ .Params.intro }}</p>
  {{ if .Pages }}<div class="report-list">{{ range .Pages }}{{ partial "report-card.html" . }}{{ end }}</div>
  {{ else }}
  <div class="record-fields">
    <div><h2>What each report will show</h2></div>
    <ul>{{ range .Params.recordFields }}<li>{{ . }}</li>{{ end }}</ul>
  </div>
  {{ end }}
</section>
{{ end }}
