{{ define "main" }}
<section class="home-hero">
  <div class="shell home-hero-grid">
    <div class="home-hero-copy">
      <p class="eyebrow">Reproduction and replication</p>
      <h1>{{ .Params.heroTitle }}</h1>
      <p class="hero-deck">{{ .Params.heroDeck }}</p>
      <div class="button-row">
        <a class="button button-primary" href="{{ `/contact/` | relURL }}">Request an evaluation</a>
        <a class="text-link" href="{{ `/methods/` | relURL }}">Read the method</a>
      </div>
    </div>
    {{ partial "research-figure.html" . }}
  </div>
</section>

<section class="home-outcomes">
  <div class="shell">
    <h2>What the evaluation produces</h2>
    <div class="home-outcome-grid">
      {{ range .Params.outcomes }}
      <article>
        <h3>{{ .title }}</h3>
        <p>{{ .text }}</p>
      </article>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
