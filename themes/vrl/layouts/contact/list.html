{{ define "main" }}
  {{ partial "page-intro.html" . }}
<section class="shell page-body contact-grid">
  <div class="contact-primary">
    <h2>Email</h2>
    <a class="email-link" href="mailto:{{ .Params.email }}">{{ .Params.email }}</a>
    <p>{{ .Params.response }}</p>
  </div>
  <div class="contact-checklist">
    <h2>What to include</h2>
    <ul>{{ range .Params.items }}<li>{{ . }}</li>{{ end }}</ul>
  </div>
</section>
{{ end }}
