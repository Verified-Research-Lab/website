<header class="site-header">
  <div class="shell header-inner">
    <a class="wordmark" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} home">
      <svg class="wordmark-mark" viewBox="0 0 36 36" aria-hidden="true">
        <path d="M5 4v28M31 4v28" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M10 10l8 16 8-16" fill="none" stroke="currentColor" stroke-width="3"/>
      </svg>
      <span>Verified<br>Research Lab</span>
    </a>
    <div class="header-actions">
      <nav class="desktop-nav" aria-label="Primary navigation">
        {{ range site.Menus.main }}
          <a href="{{ .URL }}"{{ if $.IsMenuCurrent .Menu . }} aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
        <a class="nav-cta" href="{{ `/contact/` | relURL }}"{{ if eq $.RelPermalink `/contact/` }} aria-current="page"{{ end }}>Contact</a>
      </nav>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Theme Auto" title="Theme: Auto. Click to change.">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z"/></svg>
        <span class="visually-hidden">Theme: </span><span class="theme-state" data-theme-label>Auto</span>
      </button>
      <details class="mobile-nav">
        <summary>Menu</summary>
        <nav aria-label="Mobile navigation">
          {{ range site.Menus.main }}<a href="{{ .URL }}"{{ if $.IsMenuCurrent .Menu . }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
          <a href="{{ `/contact/` | relURL }}"{{ if eq $.RelPermalink `/contact/` }} aria-current="page"{{ end }}>Contact</a>
        </nav>
      </details>
    </div>
  </div>
</header>
