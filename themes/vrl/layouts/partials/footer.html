<footer class="site-footer">
  <div class="shell footer-main">
    <strong>Verified Research Lab</strong>
    <nav aria-label="Footer navigation">
      {{ range site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
      <a href="{{ `/contact/` | relURL }}">Contact</a>
    </nav>
  </div>
  <div class="shell footer-bottom">
    <a href="mailto:{{ site.Params.contactEmail }}">{{ site.Params.contactEmail }}</a>
    <span>© {{ now.Year }} Verified Research Lab</span>
  </div>
</footer>
